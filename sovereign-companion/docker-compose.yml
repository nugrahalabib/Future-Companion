version: '3.8'
services:
  app:
    build: .
    # In production (companion.agentbuff.id) the reverse proxy should
    # forward public :443 → this container's 2970. Bind only to loopback
    # on the host when behind a proxy; open to 0.0.0.0 only for local dev.
    ports:
      - "2970:2970"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NEXT_PUBLIC_GEMINI_API_KEY: ${NEXT_PUBLIC_GEMINI_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:2970}
      PORT: 2970
      HOSTNAME: 0.0.0.0
    # Bind-mount prisma/ so writes survive container rebuilds. Without this
    # every `docker compose up --build` would reset dev.db to whatever was
    # baked into the image, wiping all respondent/transcript/survey rows
    # collected since the last build. The host dir contains schema.prisma
    # and migrations/ too, so the entrypoint's `prisma migrate deploy` still
    # works the same way; only the storage location changes.
    volumes:
      - ./prisma:/app/prisma
    restart: unless-stopped
